<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <title>КС2/КС3 генератор</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; }
    .tabs button { margin-right: 8px; }
    .tab { display: none; margin-top: 16px; }
    .tab.active { display: block; }
    table { border-collapse: collapse; width: 100%; margin-bottom: 8px; }
    th, td { border: 1px solid #ddd; padding: 6px; }
    input { width: 100%; box-sizing: border-box; }
    .actions { margin-top: 16px; display: flex; gap: 10px; }
    pre { background: #f4f4f4; padding: 8px; }
  </style>
</head>
<body>
  <h1>Черновик формы КС2/КС3</h1>

  <div class="tabs">
    <button onclick="openTab('header')">Шапка</button>
    <button onclick="openTab('ks2')">Листы КС2</button>
    <button onclick="openTab('retentions')">Удержания</button>
    <button onclick="openTab('additional')">Дополнительные поля для xml</button>
  </div>

  <section id="header" class="tab active">
    <h3>Реквизиты</h3>
    <label>№ документа <input id="doc_number" value="1" /></label><br/>
    <label>Дата <input id="doc_date" value="2026-03-17" /></label><br/>
    <label>Подрядчик <input id="contractor" value="ЛегендаЭлит" /></label><br/>
    <label>Заказчик <input id="customer" value="Заказчик" /></label>
  </section>

  <section id="ks2" class="tab">
    <h3>Листы КС2</h3>
    <button onclick="addSheet()">+ Добавить лист</button>
    <div id="sheets"></div>
  </section>

  <section id="retentions" class="tab">
    <h3>Удержания</h3>
    <button onclick="addRetention()">+ Добавить удержание</button>
    <table id="retention_table">
      <thead><tr><th>Наименование</th><th>%</th></tr></thead>
      <tbody></tbody>
    </table>
  </section>

  <section id="additional" class="tab">
    <h3>Дополнительные поля для xml</h3>
    <textarea id="additional_json" rows="6" style="width:100%">{"ProjectCode":"A-001"}</textarea>
  </section>

  <div class="actions">
    <button onclick="calculate()">Проверить/пересчитать</button>
    <button onclick="downloadFile('/api/export/xml', 'akt.xml')">Скачать XML</button>
    <button onclick="downloadFile('/api/export/xlsx', 'akt.xlsx')">Скачать XLSX</button>
  </div>

  <h3>Результат расчета</h3>
  <pre id="result">—</pre>

<script>
let sheetIndex = 0;

function openTab(id) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

function addSheet() {
  const wrapper = document.createElement('div');
  wrapper.dataset.sheet = String(sheetIndex++);
  wrapper.innerHTML = `
    <h4>Лист: <input class="sheet-title" value="Лист ${sheetIndex}" /></h4>
    <button onclick="addWorkRow(this)">+ Строка работ</button>
    <table>
      <thead><tr><th>Вид работ</th><th>Ед.</th><th>Кол-во</th><th>Цена</th></tr></thead>
      <tbody></tbody>
    </table>
  `;
  document.getElementById('sheets').appendChild(wrapper);
}

function addWorkRow(btn) {
  const tbody = btn.parentElement.querySelector('tbody');
  const row = document.createElement('tr');
  row.innerHTML = `
    <td><input class="w-name" value="Работы" /></td>
    <td><input class="w-unit" value="шт" /></td>
    <td><input class="w-qty" type="number" step="0.01" value="1" /></td>
    <td><input class="w-price" type="number" step="0.01" value="1000" /></td>
  `;
  tbody.appendChild(row);
}

function addRetention() {
  const row = document.createElement('tr');
  row.innerHTML = `<td><input class="r-name" value="Гарантийное удержание"/></td><td><input class="r-rate" type="number" step="0.01" value="5"/></td>`;
  document.querySelector('#retention_table tbody').appendChild(row);
}

function collectPayload() {
  const sheets = Array.from(document.querySelectorAll('#sheets > div')).map(sheet => ({
    title: sheet.querySelector('.sheet-title').value,
    items: Array.from(sheet.querySelectorAll('tbody tr')).map(r => ({
      name: r.querySelector('.w-name').value,
      unit: r.querySelector('.w-unit').value,
      quantity: Number(r.querySelector('.w-qty').value || 0),
      price: Number(r.querySelector('.w-price').value || 0),
    }))
  }));

  const retentions = Array.from(document.querySelectorAll('#retention_table tbody tr')).map(r => ({
    name: r.querySelector('.r-name').value,
    rate: Number(r.querySelector('.r-rate').value || 0),
  }));

  let additional = {};
  try { additional = JSON.parse(document.getElementById('additional_json').value || '{}'); } catch (_) {}

  return {
    header: {
      doc_number: document.getElementById('doc_number').value,
      doc_date: document.getElementById('doc_date').value,
      contractor_name: document.getElementById('contractor').value,
      customer_name: document.getElementById('customer').value,
    },
    ks2_sheets: sheets,
    retentions,
    additional_xml_fields: additional,
  };
}

async function calculate() {
  const payload = collectPayload();
  const res = await fetch('/api/calculate', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(payload) });
  const data = await res.json();
  document.getElementById('result').textContent = JSON.stringify(data, null, 2);
}

async function downloadFile(url, filename) {
  const payload = collectPayload();
  const res = await fetch(url, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(payload) });
  const blob = await res.blob();
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  a.click();
}

addSheet();
addWorkRow(document.querySelector('#sheets button'));
addRetention();
</script>
</body>
</html>
