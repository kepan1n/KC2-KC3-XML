<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KC2/KC3 XML — Modern Light</title>
    <link rel="stylesheet" href="./styles.css?v=20260320-1247" />
  </head>
  <body>
    <div class="app-shell" id="app-shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">Вариант B · Modern Light</p>
          <h1>KC2 / KC3 / XML — современная светлая форма</h1>
          <p class="subtitle">
            Более продуктовый интерфейс: аккуратные карточки, понятная навигация, чистый светлый UI
            для ежедневной работы менеджера или сметчика.
          </p>
        </div>
        <div class="toolbar-wrap">
          <div class="view-controls">
            <span class="view-label">Масштаб</span>
            <button id="scale-down" class="ghost mini" type="button">−</button>
            <button id="scale-reset" class="ghost mini" type="button">100%</button>
            <button id="scale-up" class="ghost mini" type="button">+</button>
            <label class="density-toggle">
              <input id="density-compact" type="checkbox" checked />
              <span>Компактные строки</span>
            </label>
          </div>
          <div class="toolbar">
            <button id="load-sample" class="ghost">Загрузить пример из Excel</button>
            <button id="save-local" class="ghost">Сохранить локально</button>
            <button id="save-server" class="ghost">Сохранить на сервер</button>
            <button id="load-server" class="ghost">Загрузить с сервера</button>
            <button id="export-json">Экспорт JSON</button>
            <button id="export-xml">Экспорт XML (XSD-ready)</button>
            <button id="add-ks2-sheet">+ Лист КС-2</button>
          </div>
        </div>
      </header>

      <section class="statusbar">
        <div class="statusbar-left">
          <button id="toggle-sidebar" class="ghost mini" type="button">Скрыть меню</button>
          <button id="toggle-headers" class="ghost mini toggle-chip" type="button">Шапки</button>
          <button id="toggle-signatures" class="ghost mini toggle-chip" type="button">Подписи</button>
          <div id="stats"></div>
        </div>
        <div id="flash" aria-live="polite"></div>
      </section>

      <div class="workspace-scale" id="workspace-scale">
        <div class="workspace">
          <aside class="sidebar" id="sidebar"></aside>
          <main class="content" id="content"></main>
        </div>
      </div>

      <footer class="footer-note">
        Вариант B — самый нейтральный и продуктовый, без привязки к визуалу старого Excel.
      </footer>
    </div>

    <script type="module" src="./app.js?v=20260320-1247"></script>
  </body>
</html>
